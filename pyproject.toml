[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Two-tier crypto trading agent: deterministic state engine, calibrated reflex classifier, code-enforced risk gate, Claude deliberation tier."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "anthropic>=1.0",
]

[project.optional-dependencies]
live = ["ccxt>=4.3"]
dev = ["pytest>=8"]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
